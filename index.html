<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Lets Track It</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/1f4b8.png">
    
    <!-- Keep Tailwind CDN for simplicity -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
      
      :root {
        --sat: env(safe-area-inset-top);
        --sab: env(safe-area-inset-bottom);
        
        /* Dark Mode (Default) */
        --bg-main: #121212;
        --bg-card: #1E1E1E;
        --bg-secondary: #262626;
        --bg-input: #121212;
        --border-color: #292524; /* stone-800 */
        --text-main: #e7e5e4; /* stone-200 */
        --text-muted: #78716c; /* stone-500 */
      }

      body.light-mode {
        /* Light Mode Overrides */
        --bg-main: #F5F5F4; /* stone-100 */
        --bg-card: #FFFFFF;
        --bg-secondary: #E7E5E4; /* stone-200 */
        --bg-input: #FFFFFF;
        --border-color: #D6D3D1; /* stone-300 */
        --text-main: #1C1917; /* stone-900 */
        --text-muted: #78716c; /* stone-500 */
      }

      body {
        font-family: 'Outfit', sans-serif;
        background-color: var(--bg-main);
        color: var(--text-main);
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        overscroll-behavior-y: none;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      input, textarea, [contenteditable] {
        user-select: text;
      }

      /* Custom Scrollbar for sleek look */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #44403c;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #57534e;
      }
      
      .glass-panel {
        background: rgba(30, 30, 30, 0.6);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      
      .dashboard-card {
        background-color: var(--bg-card);
        border-radius: 24px;
        transition: transform 0.2s ease, background-color 0.3s ease, border-color 0.3s ease;
      }
      .dashboard-card:hover {
        transform: translateY(-2px);
      }
    </style>

}
